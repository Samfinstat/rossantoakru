name: Validate SEO review
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python tools/prepare.py
      - run: PAGES=1 python tools/build.py
      - run: python tools/check.py
      - run: python tools/publish_root.py
      - name: Verify committed preview matches sources
        run: git diff --exit-code
